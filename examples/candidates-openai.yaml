# OpenAI models (key: OPENAI_API_KEY in .env). Prices are looked up automatically.
# effort: none | minimal | low | medium | high | xhigh | max, where the model supports it.
candidates:
  - model: openai/gpt-6-luna
    max_tokens: 2000
  - model: openai/gpt-6-sol
    effort: low
    max_tokens: 4000

# Any other OpenAI-compatible server works too. For example, a model served locally
