[project]
name = "llm-route-audit"
version = "0.2.1"
description = "Find out whether LLM model routing saves money without hurting quality, on your own traffic."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "model-routing", "llm-router", "llm-evaluation", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.11.0",
    "jsonschema>=4.18",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Local task labelling with the open laya decision model (large: installs PyTorch).
laya = ["laya>=0.3.29"]

[project.urls]
Homepage = "https://github.com/good2idnan/llm-route-audit"
Repository = "https://github.com/good2idnan/llm-route-audit"
Issues = "https://github.com/good2idnan/llm-route-audit/issues"
Changelog = "https://github.com/good2idnan/llm-route-audit/blob/main/CHANGELOG.md"

[project.scripts]
llm-route-audit = "llm_route_audit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_route_audit"]

# List sdist contents explicitly so local-only files (notes, .env, results) never ship.
[tool.hatch.build.targets.sdist]
include = [
    "src/llm_route_audit",
    "tests",
    "examples",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is enforced by `ruff format`; long prose strings are left alone.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
