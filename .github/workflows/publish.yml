name: Publish to PyPI

# Publishes to PyPI with trusted publishing, so no API token
# is stored in GitHub. Set it up once at pypi.org: Account > Publishing > add a pending
# publisher for project "llm-route-audit", repository good2idnan/llm-route-audit,
# workflow "publish.yml", environment "pypi".
# Turned off for now (releases are published with `uv publish`); runs only when started by
# hand. To publish on every GitHub release again, use:  release: {types: [published]}
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: |
          uv sync --locked
          uv run pytest
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
