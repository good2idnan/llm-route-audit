name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing, so no API token
# is stored in GitHub. Set it up once at pypi.org: Account > Publishing > add a pending
# publisher for project "llm-route-audit", repository good2idnan/llm-route-audit,
# workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: |
          uv sync --locked
          uv run pytest
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
